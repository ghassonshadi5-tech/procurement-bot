name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax (compile all modules)
        run: |
          python -m compileall -q app main.py init_db.py reset_db.py

      - name: Verify settings module imports
        env:
          BOT_TOKEN: "123456789:TEST_TOKEN_FOR_CI_ONLY"
          BOT_USERNAME: "test_bot"
          SUPER_ADMIN_TELEGRAM_ID: "123456789"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/test_db"
        run: |
          python -c "from app.config.settings import settings; print('Settings loaded OK')"